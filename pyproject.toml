[build-system]
requires = ["setuptools==80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "transaction-fraud-lab"
version = "0.1.0"
description = "Offline synthetic research components for transaction-fraud-lab"
requires-python = ">=3.12,<3.13"
dependencies = ["jsonschema==4.26.0"]

[project.scripts]
fraud-lab = "transaction_fraud_lab.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.6", "Markdown==3.10.3"]

[tool.setuptools]
packages = ["transaction_fraud_lab", "transaction_fraud_lab.schemas"]
package-dir = {"transaction_fraud_lab" = "src/transaction_fraud_lab", "transaction_fraud_lab.schemas" = "schemas"}

[tool.setuptools.package-data]
"transaction_fraud_lab.schemas" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
